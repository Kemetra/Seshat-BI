# Metric contract -- BudgetAmount (filled instance for finance_gl_budget, spec 137)
# F009 define-layer. Uses templates/metric-contract.yaml's EXACT field set --
# zero new fields, zero renamed fields, no forked template (spec 137 FR-013).
# formula_intent is plain-language INTENT, NOT DAX. binds_to is gold-only.

name: "BudgetAmount"
grain: "valid at fct_gl_budget_fgl grain (one row = one planned amount per account per department per fiscal quarter per budget_version); additive across account and department AT and ABOVE quarter grain only -- NEVER disaggregated to month or line grain (FR-010, OD-3)"
formula_intent: "The planned P&L amount for one account, department, fiscal quarter, and budget_version. Presented as a positive magnitude (OD-1, ruled 2026-07-30), matching ActualAmount's presentation so the two are visually comparable; direction_of_good below carries whether higher is better. Every query against this metric MUST pin budget_version -- without it, summing across both ORIGINAL and REVISION-1 double-counts the plan (measured: 268.3M instead of 136.4M). The headline BudgetAmount reads budget_version = 'ORIGINAL' (OD-2, ruled 2026-07-30 -- the plan of record); REVISION-1 remains queryable for version-identity and variant-D10 purposes but never moves this contract's default reading."
owner: "[NEEDS metric_owner -- not yet named]"
binds_to:
  gold_table: "gold.fct_gl_budget_fgl"
  columns:
    - "budget_amount"
  pii_sensitive: false

# HR11 reads unit/currency from the SOURCE-MAP column declaration (documentary
# only here); budget_amount declares currency: "USD" in
# mappings/finance_gl_budget/source-map.yaml.
unit: "USD"

definition:
  kind: base
  aggregation: sum
  filter: []
  # NOTE: pinning budget_version = 'ORIGINAL' (OD-2) is a fact-column filter
  # this shape CAN express once the semantic model exists (T042) -- recorded
  # here as an open item, not yet added, because this contract has no
  # `filter` entries approved by a named owner yet (definition.filter is
  # IMPLEMENTATION-adjacent structure; the OD-2 ruling's CONTENT is decided,
  # but wiring it into this specific field is deferred to T041/T042 so the
  # contract's readiness evidence can cite the exact commit that did it).

readiness:
  status: "blocked"
  evidence: []
  blocking_reasons:
    - "no named metric_owner has approved this contract yet"
    - "the OD-2 budget_version = 'ORIGINAL' pin is not yet wired into definition.filter -- deferred to T041 (finalize using the recorded ruling) / T042 (semantic model authoring), so this contract stays blocked until that wiring is committed and cited as evidence"

# OD-1, OD-2 and OD-3 are recorded below as DECIDED ambiguities[] entries --
# transcriptions of the owner's rulings (T039), not open items and not a
# self-grant (spec.md "Open owner decisions").
ambiguities:
  - id: "OD-1"
    decision_status: "decided"
    ruling: "revenue and expenses are both PRESENTED as positive magnitudes; polarity via direction_of_good, never the arithmetic sign (spec.md OD-1)."
    evidence:
      - "ruled by Ahmed Shaaban on 2026-07-30 -- specs/137-finance-gl-genericity-proof/spec.md \"Open owner decisions\", OD-1"
    number_moving: true
  - id: "OD-2"
    decision_status: "decided"
    ruling: "the variance/headline baseline is budget_version = 'ORIGINAL' (the plan of record). REVISION-1 exists for version identity (FR-011) and variant D10, and never moves this contract's default reading (spec.md OD-2)."
    evidence:
      - "ruled by Ahmed Shaaban on 2026-07-30 -- specs/137-finance-gl-genericity-proof/spec.md \"Open owner decisions\", OD-2"
    number_moving: true
  - id: "OD-3"
    decision_status: "decided"
    ruling: "no monthly view may be derived from the quarterly budget; a monthly-budget request is refused with the reason named (variant D11). No allocation policy exists and none may be inferred (spec.md OD-3)."
    evidence:
      - "ruled by Ahmed Shaaban on 2026-07-30 -- specs/137-finance-gl-genericity-proof/spec.md \"Open owner decisions\", OD-3"
    number_moving: true

direction_of_good: "<higher|lower|target_band -- owner-decided; not yet supplied>"

thresholds:
  target: "none"
  good: "<owner-supplied>"
  warn: "<owner-supplied>"
  critical: "<owner-supplied>"

action_on_breach:
  warn: "<owner-supplied>"
  critical: "<owner-supplied>"
