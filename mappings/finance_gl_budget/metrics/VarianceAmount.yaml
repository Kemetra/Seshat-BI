# Metric contract -- VarianceAmount (filled instance, spec 137).
# A budget-vs-actual variance measure, filed per the pattern in
# docs/patterns/target-budget-fact.md Section 3 and
# templates/metric-contract-shape.variance-vs-target.yaml -- the template's
# EXACT field set, zero new/renamed fields (FR-013).

name: "VarianceAmount"
grain: "valid at the comparison grain: fiscal quarter x account x department (fct_gl_budget_fgl's own grain, minus budget_version once pinned to ORIGINAL). ActualAmount is rolled UP from journal-line grain to meet this grain; BudgetAmount is NEVER disaggregated down to meet actuals (FR-010, OD-3; docs/patterns/target-budget-fact.md Section 4)."
formula_intent: "ActualAmount aggregated to the comparison grain MINUS BudgetAmount (budget_version = 'ORIGINAL', OD-2) at the same grain. Computed non-additively per docs/patterns/target-budget-fact.md Section 3: sum actuals separately, sum budget separately, at the comparison grain, THEN subtract -- never subtract at a finer grain and then re-aggregate the difference (that would double the CLEARING-exclusion and rollup risks already handled by ActualAmount/BudgetAmount individually). direction_of_good below states which side of zero is favourable per account_type; the arithmetic sign of the SUBTRACTION alone does not indicate good or bad (OD-1). Reads ActualAmount from gold.fct_gl_actuals_fgl and BudgetAmount from gold.fct_gl_budget_fgl -- a second gold table this contract's scalar-shaped binds_to cannot name a second key for; recorded as an OPEN NOTE below, per the variance-shape template's own precedent."
owner: "[NEEDS metric_owner -- not yet named]"
# OPEN NOTE (template-capability, not a Principle-V judgment call): this
# metric structurally reads TWO gold tables (fct_gl_actuals_fgl AND
# fct_gl_budget_fgl). templates/metric-contract.yaml's binds_to is
# single-table-shaped. The second table is named in formula_intent instead
# of a second binds_to key, per templates/metric-contract-shape.
# variance-vs-target.yaml's own documented precedent. Not resolved here --
# FR-031 forbids changing the template in this feature.
#
# AL1: blocked contracts carry a placeholder binding, never a settled one.
# Intended (pending metric_owner approval): gold.fct_gl_budget_fgl.budget_amount
# (the comparison-grain / target-side table, per the variance-shape
# template's precedent).
binds_to:
  gold_table: "gold.<fact_or_dim>"
  columns:
    - "<gold_column_a>"
  pii_sensitive: false

unit: "USD"   # documentary only (HR11 reads the source-map declaration, not this field)

readiness:
  status: "blocked"
  evidence: []
  blocking_reasons:
    - "no named metric_owner has approved this contract yet"
    - "missing-budget case: an actual (quarter, account, department) combination may have no corresponding ORIGINAL budget row (D12 -- a legitimate business exception, spec 137 data-model.md); per docs/patterns/target-budget-fact.md Section 5 this MUST be flagged via the Missing Budget Flag contract, never defaulted to a variance of 0 or silently dropped -- resolve the ambiguities[] entry below before this contract can leave blocked"
    - "direction_of_good is not yet owner-supplied: whether a positive or negative variance is favourable differs by account_type (REVENUE favours actual > budget; OPEX/COGS favour actual < budget), and this contract's single direction_of_good field cannot express a per-account-type polarity without an owner ruling on how to state it"

ambiguities:
  - id: "OD-1"
    decision_status: "decided"
    ruling: "revenue and expenses are both presented as positive magnitudes; whether higher is better is carried by direction_of_good, never by the arithmetic sign (spec.md OD-1)."
    evidence:
      - "ruled by Ahmed Shaaban on 2026-07-30 -- specs/137-finance-gl-genericity-proof/spec.md \"Open owner decisions\", OD-1"
    number_moving: true
  - id: "OD-2"
    decision_status: "decided"
    ruling: "the variance baseline is budget_version = 'ORIGINAL' (the plan of record); REVISION-1 exists for version identity and variant D10 but never moves the headline measures (spec.md OD-2)."
    evidence:
      - "ruled by Ahmed Shaaban on 2026-07-30 -- specs/137-finance-gl-genericity-proof/spec.md \"Open owner decisions\", OD-2"
    number_moving: true
  - id: "<not an A1..A11 retail-KPI id -- this domain's own missing-budget case>"
    decision_status: "undecided"
    ruling: ""
    evidence: []
    number_moving: true   # an unflagged missing-budget combination changes the reported variance if mishandled

direction_of_good: "<higher|lower|target_band -- owner-decided per account_type; not yet supplied. See blocking_reasons.>"

thresholds:
  target: "none"
  good: "<owner-supplied>"
  warn: "<owner-supplied>"
  critical: "<owner-supplied>"

action_on_breach:
  warn: "<owner-supplied>"
  critical: "<owner-supplied>"
