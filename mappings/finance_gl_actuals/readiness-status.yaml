      - "RS1: csv source -- a named owner must confirm the encoding/delimiter/header before source_ready can pass. No approval has been recorded and the agent did not self-confirm."

  mapping_ready:
    status: "blocked"
    evidence:
      - "mappings/finance_gl_actuals/source-map.yaml"
      - "mappings/finance_gl_actuals/assumptions.md"
      - "mappings/finance_gl_actuals/unresolved-questions.md"
