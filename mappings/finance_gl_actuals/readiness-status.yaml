    # constraint is stated here rather than as a blocker --
    # no silver.* SQL may be authored before the mapping gate is CLEARED (hard stop no_silver_before_mapping_cleared).
    status: "not_started"
    evidence: []
    blocking_reasons: []

  gold_ready:
    status: "not_started"
    evidence: []
    blocking_reasons: []

  semantic_model_ready:
    status: "not_started"
    evidence: []
    blocking_reasons: []

  dashboard_ready:
