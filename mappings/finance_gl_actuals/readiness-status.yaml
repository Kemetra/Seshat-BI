    # committed generator whose encoding is asserted by a test -- inventing an exemption
    # for our own fixture is exactly the self-serving carve-out the gate exists to stop.
    # Recorded as ledger row L2.
    source_kind: "csv"
    evidence:
      - "mappings/finance_gl_actuals/source-profile.md"
