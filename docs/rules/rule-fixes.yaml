# Rule id -> what it means and where to fix it.
#
# The single authored source for the agent-facing fix table in
# .claude/skills/retail-govern/SKILL.md, which is GENERATED from this file into a
# fenced region -- do not hand-edit that table, edit this file and regenerate with
# `python scripts/export_rule_fix_table.py`.
#
# `seshat check` never reads this file: it carries READER GUIDANCE only. Rule identity
# lives in docs/rules/rules-manifest.json and severity in docs/rules/severity-posture.json;
# nothing here is a threshold, a severity, or a score.
#
# Coverage is a BIJECTION against docs/rules/rules-manifest.json, enforced by
# tests/unit/test_rule_fix_table.py: registering a rule without adding guidance here
# fails, and so does guidance for an id no longer registered.
#
# `fix` must name the concrete artifact a reader edits -- a path, a YAML key, a TMDL
# element -- not the rule module, unless the fix genuinely is in code.
#
# UTF-8, no BOM, ASCII only.
version: 1
rules:
  A1:
    fix: Fix the path or mark the route planned in the route registry (`routes.py`)
    means: A route-registry target does not resolve and is not honestly marked planned
  A3:
    fix: Reconcile the two id sets (`routes_coverage.py`)
    means: "Knowledge-map route ids \u2194 `routes.yaml` ids are not in bijection"
  AD1:
    fix: Set/fix the additivity class + lineage (`additivity_consistency.py`)
    means: A metric's additivity class is composed illegally with its lineage parents (or is absent/ambiguous)
  AL1:
    fix: Either resolve the assumption (unblock) or revert the binding to a placeholder (`assumptions.py`)
    means: A metric contract is `blocked` (+reasons) yet carries a SETTLED gold binding
  AL2:
    fix: Reconcile the conflicting rulings across the contracts (`assumption_coherence.py`)
    means: Contracts on one gold table record contradictory decided ambiguity rulings
  AP1:
    fix: align the divergent anti-pattern name or number in `visual-qa.md`
    means: visual-qa and dashboard-qa list the same anti-patterns with matching numbering and names
  AQ1:
    fix: Fix the route target or its planned marker (`answerability_reconciler.py`)
    means: A decision-question route dangles (Seeded but missing) or a Planned marker is stale
  B1:
    fix: Make the DB/network import lazy (inside the function) (`never_execute.py`)
    means: Module-scope DB/network import in the static core
  B3:
    fix: Move the import lazy in the live-surface module (`live_surface_boundary.py`)
    means: A live-surface module keeps a module-scope DB/network import
  C1:
    fix: Replace the server/database arg with a parameter identifier (`git_meta.py`)
    means: Connection-string literal in a source
  C2:
    fix: Remove it, gitignore `.env`, rotate; move real values to `.env` (`git_meta.py`)
    means: Committed secret / connection context (`.env`, DSN, DO cluster slug)
  CB1:
    fix: add the baseline (e.g. SPLY) and date field to the contract in the `retail-kpi-knowledge` contracts set
    means: a growth/comparison metric contract declares a comparison baseline and a primary date field
  CT1:
    fix: adjust the `text.*` hex values or `accessibility.min_text_contrast_ratio` in `*-design-tokens.yaml`
    means: declared text/background colour pairs meet the declared WCAG contrast floor
  CT2:
    fix: adjust the adjacent hex values or `accessibility.min_adjacent_delta_e` in `*-design-tokens.yaml`
    means: adjacent `colors.data_colors` entries clear the declared deltaE76 floor
  CT3:
    fix: adjust the closest `data_colors` pair or `accessibility.min_categorical_deltae` in the tokens
      YAML
    means: every pair of `colors.data_colors` entries clears the declared whole-set deltaE76 floor
  D1:
    fix: Rename the measure in its `.tmdl` (`dax.py`)
    means: Measure not `PascalCase`
  D10:
    fix: Rewrite without the full-table scan (`dax.py`)
    means: '`FILTER(ALL/ALLSELECTED/ALLEXCEPT(...))` full-table-scan anti-pattern'
  D11:
    fix: Add a `///` doc comment above the measure (`dax.py`)
    means: Measure missing a `///` doc comment
  D2:
    fix: Add a `displayFolder` to the measure block (`dax.py`)
    means: Measure missing `displayFolder`
  D3:
    fix: Replace the inlined body with a `[Name]` reference (`dax.py`)
    means: Duplicated measure logic
  D4:
    fix: Replace with `DIVIDE(num, den)` (`dax.py`)
    means: '`/` in a measure'
  D5:
    fix: 'Set `summarizeBy: none` or annotate the exception (`dax.py`)'
    means: Implicit aggregation (WARNING)
  D6:
    fix: 'Set `crossFilteringBehavior: singleDirection`, or justify (`dax.py`)'
    means: Bidirectional relationship
  D7:
    fix: Mark a date table in the model (`dax.py`)
    means: Time-intelligence without a date-table marker
  D8:
    fix: Repoint the partition/expression `Schema=`/`FROM` to `gold` (`dax.py`)
    means: Model sources a non-`gold` schema
  D9:
    fix: Anchor on the date table instead of a literal (`dax.py`)
    means: Hardcoded date literal in a measure
  DF1:
    fix: Fix the parked-on edge or the evidence (`parked_on.py`)
    means: A parked-on dependency edge contradicts tracked-file evidence
  DL1:
    fix: Strip non-default content from the theme file (surface 3) (`design_theme.py`)
    means: Theme JSON is impure (carries more than styling defaults)
  DL2:
    fix: Remove the dynamic content from the background spec (surface 2) (`design_background.py`)
    means: A page background spec carries dynamic/data-bound content (not static structure)
  DL3:
    fix: correct the drifted `background` or `dataColors[i]` in the `*.theme.json`, or its source tokens
      YAML
    means: a theme's background and dataColors stay faithful to the design tokens they compile from
  DL4:
    fix: fill the missing or placeholder required field in that page's `design-review-evidence.md`
    means: a filled design-review evidence record carries every required field, non-placeholder
  DL5:
    fix: correct the canvas/margin/grid numbers or the stale `arithmetic_check` booleans in `design/grids/*.yaml`
    means: a layout grid's column/row arithmetic closes against its canvas and margins
  DL6:
    fix: add a real (non-placeholder) `readiness.blocking_reasons` entry to the `visual-spec.yaml` instance
    means: a visual-spec that self-attests an anti-pattern also records a blocking reason
  DL7:
    fix: fix the row's `principle_cited`/`token_cited`/`status`/`ratified_by` in `formatting-plan.md`
    means: formatting-plan rows cite a real principle/token, use allowed statuses, and never self-ratify
  DL8:
    fix: correct the drifted theme sentiment value, or the `meta.sentiment_map` entry in the tokens YAML
    means: theme sentiment colours stay faithful to a human-declared `meta.sentiment_map`
  DL9:
    fix: fill the missing field (audience, purpose, owner, evidence) in `report-intent.yaml`, creating the file if absent
    means: a filled Report Intent record carries every required field, non-placeholder
  DR1:
    fix: delete the file under the flagged prefix, or remove the phrase named in `design-stale-phrases.yaml`
    means: no tracked file sits under a known-bad path prefix and no known-stale prose phrase survives
  DS1:
    fix: fix the malformed field or mask the PII/secret value in `.seshat/semantic-decisions.yaml`
    means: Decision Store records carry a valid id/status/decision_type/scope and leak no PII or secrets
  DS2:
    fix: fill the missing `approved_by`/`evidence_identity` in `.seshat/semantic-decisions.yaml`
    means: an approved decision's approval block is complete, named-human-shaped, and evidence-identified
  DS3:
    fix: fix the batch's `members`/`excluded`/`evidence`/`confirmed_by` in the decision store
    means: a decision batch excludes critical types and records valid members, evidence, and confirmation
  DS4:
    fix: fix the dangling `supersedes`/`superseded_by` id, or resolve the scope conflict, in the decision
      store
    means: supersession references resolve and no two active decisions conflict on the same scope
  DS5:
    fix: add `approval.evidence` to the approved decision record in `.seshat/semantic-decisions.yaml`
    means: every approved decision carries non-empty evidence before a pass verdict can rest on it
  G1:
    fix: Add `**/.pbi/localSettings.json`, `**/.pbi/cache.abf`, `.env`; never ignore `definition/` (`git_meta.py`)
    means: '`.gitignore` missing a required entry'
  G2:
    fix: '`git add` the definition; stop tracking `.pbi/localSettings.json` / `cache.abf` (`git_meta.py`)'
    means: A `definition/` artifact is untracked, or a cache file is tracked
  G3:
    fix: Re-save as UTF-8 without BOM (`git_meta.py`)
    means: UTF-8 BOM in a committed text file
  G4:
    fix: "Add the glob\u2192eol mapping (TMDL/PBIR/JSON=CRLF; SQL/MD/PY=LF) (`git_meta.py`)"
    means: '`.gitattributes` EOL entry missing'
  G5:
    fix: Shorten the PBIP project/table name (`git_meta.py`)
    means: Repo-relative path > 200 chars
  G6:
    fix: Replace with a `<placeholder>`; real value comes from `.env` at refresh (`g6.py`)
    means: Real host/value in a committed PBIP parameter
  HR1:
    fix: declare the dimension's status in `conformed-dimension-map.yaml`, creating the file if absent
    means: a dimension shared by two or more gold stars is declared conformed or distinct, and matches
  HR11:
    fix: align the mismatched `columns[].unit`/`currency` values in the table's `source-map.yaml`
    means: a metric's two or more bound columns share the same declared unit and currency
  HR12:
    fix: fill `schema`/`arrival.cadence`/`restatement.policy` in `mappings/<table>/source-data-contract.yaml`
    means: when present, `source-data-contract.yaml` has a filled schema, arrival cadence, restatement
      policy
  HR13:
    fix: fix the `dim:` prefix or dimension name in `columns[].gold_placement` in the source-map
    means: every `columns[].gold_placement` `dim:` prefix resolves to a dimension the map itself declares
  HR4:
    fix: fix or add `meta.freshness.expected_cadence`/`max_staleness` in the table's `source-map.yaml`
    means: when `meta.freshness` is present, its `expected_cadence` and `max_staleness` are well-formed
  HR5:
    fix: set `time_additivity` to fully/semi/non (never fully when A10-flagged) in the metric contract
    means: an A10-flagged metric contract declares a valid `time_additivity` value
  HR6:
    fix: fix `filter.gold_table`/`filter.column` in `mappings/<table>/roles/<file>.yaml` to name a real
      `dim_*` column
    means: each RLS role contract's filter binds to a real column on a committed gold dimension
  HR7:
    fix: 'add `ON CONFLICT`, a `-- reload-strategy: <key>` header, or an entry in the warehouse load policy, creating the file if absent'
    means: a non-full-rebuild gold load (append/upsert/partial delete) declares its reload/dedup key
  HR8:
    fix: use `INTERVAL '1 day'` and correct the start/end order in the `dim_date` INSERT
    means: '`dim_date`''s generate_series uses a one-day step and non-reversed literal bounds'
  HR9:
    fix: rename the orphaned reference to match a real TMDL column/measure, or fix the stale `visual-contract-binding-map.md`
    means: every column/measure reference in contracts, TMDL DAX, and dashboard bindings resolves
  KP1:
    fix: fix `generic_kpi_ref`/`custom`/`decision_refs`/`source_evidence` in the metric contract
    means: a metric contract opting into provenance fields keeps them well-formed and resolvable
  KR1:
    fix: fix the entry, or remove the leaked token, in the `retail-kpi-knowledge` registry
    means: generic KPI registry entries are well-formed, unique, and free of client or physical-layer
      leakage
  P1:
    fix: Move the file to the right folder (`git_meta.py`)
    means: PBIP outside `powerbi/`, or SQL outside `warehouse/`
  P2:
    fix: Reword to `^(feat\
    means: Commit subject off-convention
  PP1:
    fix: Fill the section in the handoff pack (never self-grant the approval) (`publish_pack.py`)
    means: A required handoff-pack section is unfilled (incl. the publish-approval slot)
  R1:
    fix: Make `datasetReference.byPath.path` relative in `definition.pbir` (`pbir.py`)
    means: Report model reference is absolute / `byConnection`
  R2:
    fix: remove the business-logic key, or fix the BaseTheme path, in the report's `definition/report.json`
    means: a PBIR `report.json` is valid JSON, keeps its `$schema`, resolves BaseTheme refs, defines no
      logic
  RS1:
    fix: Fix the offending field in `mappings/<table>/readiness-status.yaml` (`readiness_status.py`)
    means: A readiness-status file is internally inconsistent (status/evidence/blockers/approvals/current-stage
      disagree)
  S1:
    fix: Rename the identifier in `warehouse/**/*.sql` (`sql.py`)
    means: Non-snake_case SQL identifier
  S2:
    fix: Rename the schema to `bronze`/`silver`/`gold` (`sql.py`)
    means: Stale `raw`/`marts` schema token (only in schema position)
  S3:
    fix: Rename the `CREATE VIEW` object (`sql.py`)
    means: View missing `vw_` prefix
  S4a:
    fix: Rename to `^\d{4}_.+\.sql$`; contiguous + unique (`sql.py`)
    means: Migration filename / numbering broken
  S4b:
    fix: Use a guarded form (`IF NOT EXISTS`, `CREATE OR REPLACE VIEW`) (`sql.py`)
    means: Bare `CREATE`/`ALTER` (layer-aware WARNING)
  S5:
    fix: Fix the cast/type in the silver SQL (`sql.py`)
    means: 'Type discipline (RC7): money/qty not exact NUMERIC, or leading-zero id not TEXT'
  S6:
    fix: Add the `-1` unknown member + FK COALESCE in the gold dim (`sql.py`)
    means: Gold dim missing its `-1` unknown member (RC14)
  S7:
    fix: Build the date dim as a contiguous generated calendar (`sql.py`)
    means: Date dim not a contiguous `generate_series` calendar (RC15)
  S8:
    fix: Remove the sentinel member from the date dim (`sql.py`)
    means: A marked date table carries a `-1`/NULL member
  S9:
    fix: Move the junk-row filter ahead of the `''`->NULL conversion (`sql.py`)
    means: A junk filter targeting `''` runs after nulling, so it is dead and the junk rows survive
  SC1:
    fix: Correct the stale prose claim (`status_claims.py`)
    means: A prose status claim (planned/built) contradicts tracked-file evidence
  SC2:
    fix: Update the count + the `rule-count-claims.yaml` anchor together (`rule_count_claims.py`)
    means: A prose "N rules" count claim disagrees with the authoritative count
  SF1:
    fix: declare or fix the basename's shared/distinct status in `shared-spine.yaml`, creating the file if absent
    means: same-basename checklists shared across skills are declared shared/distinct and shared copies
      match
  SL1:
    fix: Fix the scorecard structure (`scorecard.py`)
    means: A coverage scorecard is malformed (bad status enum / unnamed blocker / a percentage)
