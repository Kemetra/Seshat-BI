name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact commit SHA or immutable tag to validate
        required: true
        type: string
      publication_action:
        description: Validation is the zero-authority default
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - publish-pypi

permissions: {}

concurrency:
  group: release-candidate-${{ inputs.candidate_ref }}
  cancel-in-progress: false

jobs:
  build-validate:
    name: Build and validate without publication credentials
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install build validators
        # The PACKAGE is a build validator here, not just a runtime artifact:
        # the "Verify synchronized version and generated bundles" step below
        # runs export_agent_bundles.py, which imports seshat.allowlist_derivation
        # and seshat.portability_audit (spec 138, PRs #547/#548). With only
        # `build twine pyyaml` that step dies on ModuleNotFoundError.
        #
        # This one is the dangerous copy of the defect. prepare-coordinated-release
        # hits the same missing import at DISPATCH, which costs a workflow run;
        # this job runs against an already-pushed, immutable refs/tags/v* ref, so
        # failing here burns the version permanently -- the same way v0.6.0 and
        # v0.7.0 became unpublishable. Found while the v0.8.0 dispatch failed
        # upstream, before any tag existed.
        #
        # Installed before "Verify source identity", which asserts
        # `test -z "$(git status --porcelain)"`. Safe: hatchling writes no
        # in-tree egg-info, and dist/, build/ and *.egg-info/ are gitignored,
        # so the editable install leaves no untracked, un-ignored path behind.
        run: |
          python -m pip install build twine
          python -m pip install -e .
      - name: Verify source identity
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "$CANDIDATE_REF^{commit}")"
          test -z "$(git status --porcelain)"
      - name: Verify synchronized version and generated bundles
        run: |
          python scripts/check_release_versions.py --check
          python scripts/export_agent_bundles.py --check
      - name: Build exactly one wheel and one sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Strict metadata, contents, and isolated sdist rebuild
        run: >-
          python scripts/inspect_release_artifacts.py
          --dist dist
          --output release-staging/python-artifact-report.json
      - name: Require a release-ready candidate audit
        run: >-
          python scripts/release_candidate_audit.py
          --require-release-ready
          --output release-staging/release-candidate.json
      - name: Freeze exact artifact checksums
        shell: bash
        run: |
          git rev-parse HEAD > release-staging/SOURCE_REVISION
          mkdir -p release-staging/dist
          sha256sum -- dist/*.whl dist/*.tar.gz > release-staging/SHA256SUMS
          cp dist/*.whl dist/*.tar.gz release-staging/dist/
          test "$(find release-staging/dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find release-staging/dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find release-staging/dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Build and inspect exact npm tarballs
        run: |
          node npm/stage-release-packages.js --output release-staging/npm
          cd release-staging
          sha256sum -- npm/scoped/*.tgz npm/alias/*.tgz > NPM_SHA256SUMS
      - name: Upload immutable candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seshat-bi-candidate-${{ github.run_id }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-pypi:
    name: Publish exact validated artifacts to PyPI
    if: ${{ inputs.publication_action == 'publish-pypi' }}
    needs: build-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject forks and non-tag publication
        shell: bash
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_REF: ${{ github.ref }}
        run: |
          test "$ACTUAL_REPOSITORY" = "Kemetra/Seshat-BI"
          test "$RUN_REF" = "$CANDIDATE_REF"
          test "$REF_PROTECTED" = "true"
          case "$CANDIDATE_REF" in
            refs/tags/v*) ;;
            *) echo "Publication requires an immutable refs/tags/v* candidate"; exit 1 ;;
          esac
      - name: Download the validated candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seshat-bi-candidate-${{ github.run_id }}
          path: release-staging
      - name: Revalidate exact filenames and digests
        shell: bash
        run: |
          cd release-staging
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(wc -c < SOURCE_REVISION)" -eq 41
          grep -Eq '^[0-9a-f]{40}$' SOURCE_REVISION
          sha256sum --check SHA256SUMS
      - name: Trusted Publishing via GitHub OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-staging/dist/
          attestations: true
          verbose: true

  publish-npm-scoped:
    name: Publish the agent skills bundle to npm
    # Runs only after PyPI succeeds. npm carries the SAME version number, so a
    # published npm package whose PyPI counterpart failed would be a lie about
    # what exists -- `needs` makes that ordering structural, not a convention.
    if: ${{ inputs.publication_action == 'publish-pypi' }}
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject forks and non-tag publication
        # Byte-identical to the PyPI job's guard. Publication requires the
        # workflow to RUN FROM the immutable tag it is publishing: `RUN_REF`
        # must EQUAL `CANDIDATE_REF`, so `--ref main` with a tag candidate is
        # refused. Learned the hard way during v0.8.1.
        shell: bash
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_REF: ${{ github.ref }}
        run: |
          test "$ACTUAL_REPOSITORY" = "Kemetra/Seshat-BI"
          test "$RUN_REF" = "$CANDIDATE_REF"
          test "$REF_PROTECTED" = "true"
          case "$CANDIDATE_REF" in
            refs/tags/v*) ;;
            *) echo "Publication requires an immutable refs/tags/v* candidate"; exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download the validated candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seshat-bi-candidate-${{ github.run_id }}
          path: release-staging

      - name: Revalidate exact npm tarball digests
        shell: bash
        run: |
          cd release-staging
          test "$(find npm/scoped -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          test "$(find npm/alias -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          sha256sum --check NPM_SHA256SUMS

      - name: Publish the prebuilt @kemetra/seshat-bi tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-staging/npm/scoped/*.tgz --provenance --access public

  publish-npm-alias:
    name: Publish the unscoped npm alias
    if: ${{ inputs.publication_action == 'publish-pypi' }}
    needs: publish-npm-scoped
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject forks and non-tag publication
        shell: bash
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_REF: ${{ github.ref }}
        run: |
          test "$ACTUAL_REPOSITORY" = "Kemetra/Seshat-BI"
          test "$RUN_REF" = "$CANDIDATE_REF"
          test "$REF_PROTECTED" = "true"
          case "$CANDIDATE_REF" in
            refs/tags/v*) ;;
            *) echo "Publication requires an immutable refs/tags/v* candidate"; exit 1 ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download the validated candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seshat-bi-candidate-${{ github.run_id }}
          path: release-staging
      - name: Revalidate exact npm tarball digests
        shell: bash
        run: |
          cd release-staging
          test "$(find npm/scoped -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          test "$(find npm/alias -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          sha256sum --check NPM_SHA256SUMS
      - name: Publish the prebuilt unscoped seshat-bi alias tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-staging/npm/alias/*.tgz --provenance --access public
