name: prepare-coordinated-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Owner-approved stable SemVer without a leading v (for example, 0.2.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-coordinated-release
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    name: Prepare synchronized Python, Claude, and Codex release PR
    if: ${{ github.repository == 'Kemetra/Seshat-BI' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: release/v${{ inputs.version }}
    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install release preparation dependencies
        # Installs the PACKAGE, not just pyyaml. export_agent_bundles.py imports
        # seshat.allowlist_derivation and seshat.portability_audit (spec 138,
        # PRs #547/#548), so a bare `pip install pyyaml` makes the "Regenerate
        # Claude and Codex bundles" step die on ModuleNotFoundError: No module
        # named 'seshat'. That is exactly how the v0.8.0 dispatch first failed:
        # spec 138 added the import, no release was cut between then and now, so
        # nothing exercised this workflow against it. ci.yml never caught it
        # because it runs the same exporter AFTER `pip install -e ".[dev]"`.
        #
        # -e mirrors ci.yml. Safe against the diff guards below: hatchling
        # writes no in-tree egg-info, and dist/, build/ and *.egg-info/ are
        # gitignored regardless. Safe against the version projection too: the
        # exporter reads project.version from pyproject.toml directly
        # (_project_version), never from installed metadata, so installing at
        # the pre-projection version does not poison the bundle manifests.
        # pyyaml stays satisfied as a core dependency of the package itself.
        run: python -m pip install -e .

      - name: Validate owner-selected version and release branch
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          raw_version = os.environ["VERSION"]
          version = raw_version.strip()
          if raw_version != version:
              raise SystemExit("version must not contain leading or trailing whitespace")
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
              raise SystemExit("version must be stable SemVer MAJOR.MINOR.PATCH without a leading v")

          current = str(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          current_match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", current)
          if current_match is None:
              raise SystemExit(f"current project version is not stable SemVer: {current}")
          current_parts = tuple(int(part) for part in current_match.groups())
          next_parts = tuple(int(part) for part in version.split("."))
          if next_parts <= current_parts:
              raise SystemExit(f"version {version} must be greater than current version {current}")
          PY

          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "tag v${VERSION} already exists"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "remote branch ${RELEASE_BRANCH} already exists"
            exit 1
          fi

      - name: Project the version and freeze the changelog
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          from scripts.release_note_gate import validate_release_note

          version = os.environ["VERSION"].strip()

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          updated_pyproject, replacements = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              pyproject,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("could not update exactly one project.version line")
          pyproject_path.write_text(updated_pyproject, encoding="utf-8")

          # The npm package MIRRORS the Python version by contract, and its own
          # packaging test asserts parity against pyproject and the plugin
          # manifest. Project it here or the release publishes a PyPI version
          # whose npm counterpart still claims the previous one. json round-trip
          # rather than a regex: `version` appears once at the top level, but a
          # naive pattern would also match a dependency pin.
          import json

          npm_manifest_path = Path("package.json")
          npm_manifest = json.loads(npm_manifest_path.read_text(encoding="utf-8"))
          npm_manifest["version"] = version
          npm_manifest_path.write_text(
              json.dumps(npm_manifest, indent=2) + "\n", encoding="utf-8"
          )

          # Glob the whole directory, matching the authority that enforces this:
          # test_install_docs_version_pins_match_the_packaged_version reconciles
          # EVERY docs/install/*.md pin against pyproject. A hardcoded subset here
          # silently drifts the moment a new install doc lands (client-quickstart.md
          # did exactly that and failed the v0.7.0 release PR).
          install_doc_paths = sorted(Path("docs/install").glob("*.md"))
          projected_install_docs = []
          for install_doc_path in install_doc_paths:
              install_doc = install_doc_path.read_text(encoding="utf-8")
              updated_install_doc, replacements = re.subn(
                  r"seshat-bi==\d+\.\d+\.\d+",
                  f"seshat-bi=={version}",
                  install_doc,
              )
              if replacements > 1:
                  raise SystemExit(
                      f"{install_doc_path} must contain at most one seshat-bi version pin"
                  )
              if replacements == 1:
                  install_doc_path.write_text(updated_install_doc, encoding="utf-8")
                  projected_install_docs.append(install_doc_path.as_posix())
          if not projected_install_docs:
              raise SystemExit("no docs/install/*.md file carries a seshat-bi version pin")

          marketplace_path = Path(".claude-plugin/marketplace.json")
          marketplace = json.loads(marketplace_path.read_text(encoding="utf-8"))
          marketplace["metadata"]["version"] = version
          plugins = marketplace.get("plugins", [])
          if len(plugins) != 1 or plugins[0].get("name") != "seshat-bi":
              raise SystemExit("Claude marketplace must contain exactly one seshat-bi plugin")
          plugins[0]["version"] = version
          marketplace_path.write_text(
              json.dumps(marketplace, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## [Unreleased]"
          marker_index = changelog.find(marker)
          if marker_index < 0:
              raise SystemExit("CHANGELOG.md has no [Unreleased] heading")
          body_start = marker_index + len(marker)
          next_heading = changelog.find("\n## [", body_start)
          if next_heading < 0:
              raise SystemExit("CHANGELOG.md has no release heading after [Unreleased]")
          unreleased_body = changelog[body_start:next_heading]
          if not unreleased_body.strip():
              raise SystemExit("CHANGELOG.md [Unreleased] is empty; merge release notes before preparing a version")
          replacement = f"## [Unreleased]\n\n## [{version}] -- {date.today().isoformat()}"
          changelog = changelog[:marker_index] + replacement + unreleased_body + changelog[next_heading:]
          changelog_path.write_text(changelog, encoding="utf-8")

          try:
              validate_release_note(Path.cwd(), version)
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc
          PY

      - name: Require the expected version-projection diff
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          # Derived, not hardcoded: every docs/install/*.md that carries a pin was
          # projected by the previous step, so it must appear in the diff. Keeping a
          # literal list here is what let client-quickstart.md drift out of sync.
          pin = re.compile(r"seshat-bi==\d+\.\d+\.\d+")
          install_docs = {
              path.as_posix()
              for path in Path("docs/install").glob("*.md")
              if pin.search(path.read_text(encoding="utf-8"))
          }
          expected = {
              ".claude-plugin/marketplace.json",
              "CHANGELOG.md",
              "package.json",
              "pyproject.toml",
          } | install_docs
          changed = set(
              subprocess.run(
                  ["git", "diff", "--name-only"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"version projection changed {sorted(changed)}; expected {sorted(expected)}"
              )
          PY

      - name: Commit the immutable version projection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          # Stage the whole docs/install directory, not a hardcoded subset: the
          # projection step globs docs/install/*.md, so naming three files here
          # left a projected-but-unstaged doc behind, which then surfaced as an
          # "unexpected generated bundle file" in the later bundle-diff guard.
          # The preceding step already asserted the exact projected file set.
          # -u so only TRACKED modifications are staged: the preceding guard uses
          # `git diff --name-only`, which cannot see untracked files, so a plain
          # `git add docs/install` could sweep in a stray the guard never checked.
          git add -u -- \
            pyproject.toml \
            package.json \
            CHANGELOG.md \
            docs/install \
            .claude-plugin/marketplace.json
          git diff --cached --check
          git commit -m "chore: project v${VERSION} version metadata"

      - name: Regenerate Claude and Codex bundles from the version projection
        run: python scripts/export_agent_bundles.py

      - name: Build and inspect the real artifacts before any tag exists
        shell: bash
        run: |
          # THE point of this step: inspect_release_artifacts.py used to run only
          # in release.yml, i.e. AFTER the immutable v* tag was pushed. Anything it
          # blocks on therefore cost a whole version number -- v0.6.0 died on a
          # docstring spoof URL, v0.7.0 on scan.py's own macOS-path detection regex
          # (the secret scanner tripping itself). Both were unpublishable the moment
          # they were tagged. Running the same inspector here means a content block
          # fails the DISPATCH: no release branch, no PR, no tag, no burned version.
          #
          # This scans the BUILT wheel + sdist (all of src/seshat/), which is a
          # strictly larger corpus than export_agent_bundles.py's per-entry
          # _scan_public_content -- that only covers allowlisted bundle sources, so
          # shipped-but-not-bundled Python (exactly scan.py) was never pre-scanned.
          #
          # dist/, build/ and release-staging/ are gitignored, so this leaves the
          # tree clean for the `git diff --check` and bundle-diff guards below.
          # Must match release.yml's install set: the inspector shells out to
          # `python -m twine check --strict`, so a missing twine is reported as a
          # blocking_reason indistinguishable from a real artifact defect (it read
          # "returned non-zero exit status 1" with "No module named twine" logged
          # above it). Do NOT reach for --skip-twine: the strict check validates
          # that the README renders on PyPI, which is a genuine publish blocker
          # and exactly the kind of post-tag surprise this step exists to catch.
          python -m pip install --quiet build twine
          rm -rf dist release-staging
          mkdir -p release-staging
          python -m build
          python scripts/inspect_release_artifacts.py \
            --dist dist \
            --output release-staging/python-artifact-report.json

      - name: Validate synchronized release candidate
        shell: bash
        run: |
          python scripts/check_release_versions.py --check
          python scripts/export_agent_bundles.py --check
          python scripts/release_candidate_audit.py --require-release-ready
          git diff --check

      - name: Require the expected generated-bundle diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed_prefixes = (
              "integrations/claude-code/seshat-bi/",
              "integrations/codex/seshat-bi/",
          )
          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          unexpected = sorted(
              path
              for path in changed
              if not path.startswith(allowed_prefixes)
          )
          if unexpected:
              raise SystemExit(f"unexpected generated bundle files: {unexpected}")
          if not changed:
              raise SystemExit("bundle generation produced no changes")
          PY

      - name: Commit generated bundles and push the release branch
        shell: bash
        run: |
          git add -- \
            integrations/claude-code/seshat-bi \
            integrations/codex/seshat-bi
          git diff --cached --check
          git commit -m "chore: generate v${VERSION} agent bundles"
          git push --set-upstream origin "${RELEASE_BRANCH}"

      - name: Open a draft release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-pr-body.md <<EOF
          ## Coordinated release candidate v${VERSION}

          This owner-triggered workflow prepared one synchronized candidate for:

          - Python / PyPI package metadata
          - Claude Code repository plugin and marketplace metadata
          - Codex repository plugin bundle

          ## Before merge

          - Review the changelog section and generated bundle diff.
          - Require normal CI and repository checks to pass.
          - Confirm that v${VERSION} is the intended owner-approved SemVer.
          - Merge with a merge commit. Do not squash or rebase: both release-preparation
            commits must remain ancestors of the release commit for bundle provenance.
          - Approve any PR checks GitHub marks as approval-required for bot-created pull requests.

          ## After merge

          1. Create the immutable annotated tag v${VERSION} at the merged release commit.
          2. Run the existing release-candidate workflow from that tag with publication_action=publish-pypi.
          3. Verify the GitHub Release, PyPI install, and repository-plugin update paths.

          This PR does not create a tag, publish to PyPI, create a GitHub Release, or submit to public Claude/OpenAI catalogs.
          EOF

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${RELEASE_BRANCH}" \
            --draft \
            --title "release: prepare v${VERSION}" \
            --body-file /tmp/release-pr-body.md

      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## Release PR prepared"
            echo
            echo "- Version: v${VERSION}"
            echo "- Branch: ${RELEASE_BRANCH}"
            echo "- Surfaces synchronized: Python, Claude Code, Codex"
            echo "- Publication: not performed"
          } >> "${GITHUB_STEP_SUMMARY}"
