name: ci

# Triggers: `push` is restricted to main so a branch push does not fire this
# workflow twice on one SHA (once for `push`, once for `pull_request`). The
# duplicates competed for runners and were reaped as `cancelled` after ~2h;
# because branch protection reads the MOST RECENT result per context name, a
# reaped `check` masked a green `pull_request` run on the identical SHA (#591).
# PR validation is owned by `pull_request`; `push` covers post-merge main.
# Matches the filtered-push precedent in dagster-smoke.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Credential-free bundle validation or fixture classification
        required: true
        default: classify-fixtures
        type: choice
        options:
          - classify-fixtures
          - validate-bundles

# One in-flight run per ref: a rapid re-push supersedes its own predecessor
# instead of queueing beside it and starving both for runners. Never cancels on
# main -- post-merge runs are the release audit trail and must each complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths (fail closed)
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A manual dispatch is an explicit request for the complete suite.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/changed-files.txt"
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed_file"
              ;;
            push)
              if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo "code_changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$changed_file"
              ;;
            *)
              echo "code_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Only human-facing prose and documentation images qualify. Governed
          # Markdown such as AGENTS.md, CLAUDE.md, COMPASS.md, skills/** and
          # specs/** deliberately falls through to the full suite.
          code_changed=false
          if [ ! -s "$changed_file" ]; then
            code_changed=true
          else
            while IFS= read -r path; do
              case "$path" in
                docs/*.md|docs/*.rst|docs/*.txt|docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.gif|docs/*.svg|\
                .github/ISSUE_TEMPLATE/*.md|.github/PULL_REQUEST_TEMPLATE.md|\
                CHANGELOG.md|CODE_OF_CONDUCT.md|CONTRIBUTING.md|ONBOARDING.md|README.md|RELEASE_NOTES.md|SECURITY.md)
                  ;;
                *)
                  code_changed=true
                  break
                  ;;
              esac
            done < "$changed_file"
          fi

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          if [ "$code_changed" = "false" ]; then
            echo "Documentation-only change: code-heavy jobs will report skipped/success."
          fi

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: `retail check` runs git-metadata rules (P2 scans the
          # commit-message BASE..HEAD range; C2/G1/G2 read git ls-files /
          # check-ignore). A shallow clone would make those mis-scan or error.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff format check
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        run: ruff format --check src tests scripts

      - name: Ruff lint
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        run: ruff check src tests scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json

      - name: Build the Studio frontend
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        # Node is a BUILD-time dependency only -- FR-005 promises END USERS need none.
        # Building here is what makes the FR-033 "no remote asset" tests and the
        # wheel-content test actually RUN: they read the built output, so without this
        # step all seven of them skip and enforce nothing.
        run: python scripts/build_studio_frontend.py

      - name: Unit tests
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        run: pytest -m unit

      - name: Governed dbt adapter contract
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        # The dbt unit slice runs above via the unit marker. These credential-free
        # contract/integration tests pin packaging, docs, public imports, artifact
        # integrity, and the exact plan/evidence flow without contacting a database.
        run: >-
          pytest
          tests/contract/test_dbt_documentation.py
          tests/contract/test_dbt_package_contract.py
          tests/contract/test_dbt_project.py
          tests/contract/test_dbt_public_surface.py
          tests/integration/test_dbt_artifact_flow.py

      - name: Public distribution contract tests
        if: ${{ needs.changes.outputs.code_changed == 'true' }}
        # Explicit blocking gate for version/evidence/export contract behavior.
        # The repository may truthfully report a candidate as blocked before an
        # owner-approved version projection; these tests verify that fail-closed
        # behavior without consuming credentials or publishing anything.
        run: >-
          pytest
          tests/contract/test_public_knowledge_allowlist.py
          tests/contract/test_generated_agent_bundles.py
          tests/contract/test_release_version_sync.py
          tests/contract/test_release_evidence_models.py

      - name: Generated agent bundle drift
        run: python scripts/export_agent_bundles.py --check

      - name: Credential-free release candidate audit
        # Blocks structural regressions while truthfully allowing the report to
        # retain owner/version/publication blockers before release authorization.
        run: python scripts/release_candidate_audit.py --repository-check

      - name: Retail governance check
        # Scope P2's commit-message check to THIS branch's commits, not an
        # arbitrary HEAD~20 window: range = merge-base(origin/main, HEAD)..HEAD.
        # This makes the gate STABLE regardless of HEAD position (aged-out history
        # never re-enters the window). fetch-depth: 0 (above) provides origin/main
        # for merge-base. If the base cannot be determined, fall back to a bare
        # `retail check` so CI never hard-errors on a bad range.
        #
        # NOTE: on a feature branch this WILL flag any non-conforming historical
        # subjects in range (e.g. grandfathered `test:` commits). That is correct
        # and honest — they collapse into one conforming commit on squash-merge to
        # main, at which point this gate is clean. We do not hide them.
        run: |
          git fetch origin main 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            retail check --commit-range "$BASE..HEAD"
          else
            retail check
          fi

      - name: Retail semantic-check (L3 contract<->DAX drift)
        # Separate step from `retail check` (above): the static check core is
        # stdlib-only and must never import yaml. `retail semantic-check` parses
        # metric-contract YAML (pyyaml, already installed via the [dev] extra) to
        # gate the contract<->DAX denominator drift class (drift => exit 1). No
        # --commit-range: it reads committed TMDL + contracts, not git diffs.
        #
        # --require-inputs is load-bearing: without it, discovering ZERO inputs
        # printed "no drift (0 findings)" and exited 0 -- indistinguishable from a
        # genuinely clean repo. This repo always carries contracts/TMDL, so zero
        # discovery here means the glob stopped matching (a rename/move), and that
        # must FAIL rather than report a green pass.
        run: retail semantic-check --repo . --require-inputs

      - name: Retail kit-lint (compass projection drift)
        # Separate step (feature 072): like semantic-check, this parses yaml
        # (.seshat/kit-source.yaml) so it stays OUT of the stdlib-only `retail check`
        # core. Fails loud (exit 1) when a compass projection -- .seshat/compass.yaml
        # or the fenced SESHAT-KIT regions of AGENTS.md/CLAUDE.md -- drifts from the
        # canonical source (i.e. someone edited the source but forgot `retail init`).
        # Read-only; reads no constitution. On an un-bootstrapped repo it exits 0.
        run: retail kit-lint --repo .

  statistics:
    # Numerical methods are optional at runtime but mandatory in their own
    # credential-free CI environment. The base `check` job remains on .[dev].
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install statistics environment
        run: pip install -e ".[dev,stats,stats-change]"
      - name: Statistical tests
        run: pytest -m statistics

  report-surfaces:
    # The report surfaces are optional at runtime but mandatory in their own
    # environment, for the same reason `statistics` has one: the base `check` job
    # stays on .[dev], which is what proves the surfaces are lazily imported and
    # the static core stays pyyaml-only.
    #
    # This job is also the only place a REAL browser runs. Every other PDF test
    # drives the PagePrinter port with a fake, so without this job the assertion
    # that Chromium's actual output is tagged and embeds fonts would be green
    # everywhere and verified nowhere.
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install report environment
        run: pip install -e ".[dev,report,report-pdf]"
      - name: Install chromium
        run: python -m playwright install --with-deps chromium
      - name: Cross-surface invariants
        # Marked `integration`, so `pytest -m unit` in the `check` job does not
        # reach them. Named here explicitly rather than left to a marker sweep.
        run: pytest tests/integration/test_report_surfaces_agree.py
      - name: Real browser render
        # The test self-skips where the browser is absent, which is correct for an
        # adopter checkout and useless as a gate. A skip HERE means this job
        # installed a browser and then failed to use it, so it is a failure.
        run: |
          set -euo pipefail
          output=$(pytest tests/integration/test_report_pdf_chromium.py -q -rs --no-header)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::the real-browser test skipped in the job that installs the browser"
            exit 1
          fi

  smoke:
    # Windows is the release gate for the first-success journey. The test builds both
    # package artifacts, installs the wheel with pipx in a throwaway location, then
    # exercises seshat help/init-project/status/next/check with no optional extras.
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install smoke harness tools
        run: python -m pip install build pipx
      - name: Windows first-success smoke
        run: python scripts/install_smoke_test.py

  smoke-unix:
    # Best-effort beta coverage for the documented macOS/Linux journey. It is kept
    # non-blocking by design; Windows remains the release gate.
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install smoke harness tools
        run: python -m pip install build pipx
      - name: Best-effort first-success smoke
        run: python scripts/install_smoke_test.py

  agent-distribution:
    # Credential-free structural and semantic classification. Real external
    # GitHub install/CLI/IDE observations remain a separately recorded owner
    # gate; this job neither authenticates nor claims public availability.
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: claude-code
            client: cli
            transcript: tests/fixtures/public_distribution/claude/acceptance.pass.json
          - platform: codex
            client: cli
            transcript: tests/fixtures/public_distribution/codex/acceptance.cli.pass.json
          - platform: codex
            client: ide
            transcript: tests/fixtures/public_distribution/codex/acceptance.ide.pass.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate generated platform bundle
        run: >-
          python scripts/external_agent_acceptance.py
          --platform ${{ matrix.platform }}
          --client ${{ matrix.client }}
          --validate-bundle
      - name: Classify shared synthetic outcome
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_mode == 'classify-fixtures' }}
        run: >-
          python scripts/external_agent_acceptance.py
          --platform ${{ matrix.platform }}
          --client ${{ matrix.client }}
          --transcript ${{ matrix.transcript }}

  integration:
    # Credential-free acceptance coverage that was previously collected but not
    # executed by the required CI. The two real-report tests stay in their
    # purpose-built browser job above; live DB and statistics retain their own
    # explicitly provisioned environments.
    needs: changes
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install credential-free integration environment
        run: pip install build twine -e ".[dev]"
      - name: Credential-free integration tests
        run: >-
          pytest -m "integration and not live_db and not statistics"
          --ignore=tests/integration/test_report_surfaces_agree.py
          --ignore=tests/integration/test_report_pdf_chromium.py

  friendly-pr-summary:
    # Presentation-only opt-in. Keeping it in its own job confines PR write
    # authority to the one operation that needs it; every test job stays read-only.
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      vars.POST_FRIENDLY_PR_SUMMARY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Post or update the friendly summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            retail check --format review --commit-range "$BASE..HEAD" > review.json || true
          else
            retail check --format review > review.json || true
          fi
          python scripts/post_friendly_pr_summary.py \
            --review review.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
