version: 2
updates:
  # Python dependencies (runtime + optional extras declared in pyproject.toml).
  # The runtime surface is minimal (pyyaml only); most of the surface is the
  # dev/db/mssql/... extras used in CI. Weekly is enough for a beta package.
  #
  # commit-message.prefix "build" (spec 136, FR-014): Dependabot emits a
  # SCOPE-FREE subject (`build: bump X from A to B`). `build` is in the P2
  # governance allow-list and `prefix` without `include: scope` yields no
  # parenthesized scope, so a bot pip PR passes the P2 SUBJECT_RE with NO human
  # edit (the old `chore(deps):` default tripped P2 on every bot PR).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: []
    # `mcp>=1.28,<2` is a GOVERNED upper bound, not staleness. pyproject keeps
    # the stable v1 line pinned below v2 so a normal install and the static
    # governance core never acquire the protocol SDK's next major, and spec 136
    # (`specs/136-dep-freshness-gate/spec.md`) names this exact specifier as the
    # canonical "governed pin with an upper bound" the freshness gate is built to
    # TOLERATE rather than flag. Dependabot cannot read that intent, so it
    # proposed widening the ceiling to `<3` (PR #533, closed unmerged).
    #
    # Adopting MCP v2 is an owner decision with a four-file blast radius -- the
    # literal extra table in `src/seshat/cli/__init__.py`, two install-lane
    # assertions in `tests/unit/test_issue_regression_507_install_lane.py`, and
    # `docs/install/agent-install.md` -- so it lands as a deliberate PR, never as
    # a bot ceiling-widening. MINOR/PATCH mcp updates stay watched.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  # Orchestration project (spec 136, FR-013): the /orchestration/dagster pip
  # environment was UNWATCHED before this change -- the exact coverage hole that
  # let the spec-134 dagster pin drift unseen. Dependabot parses this manifest
  # today: its `dependencies` are all NAMED PyPI distributions (dagster,
  # psycopg2-binary, pyyaml -- the dagster-dbt pin spec 135 later dropped is gone
  # from this list); the repo-local seshat-bi dependency is supplied at INSTALL
  # time (`uv pip install -e ../..`), not declared in the pyproject metadata, so
  # there is no local/direct reference for Dependabot to refuse (plan-review
  # D4). Should a future change add a repository-local `seshat-bi[dbt]`
  # reference to this pyproject's metadata and Dependabot then refuse the whole
  # manifest, the fallback is to keep this directory watched for its remaining
  # NAMED pins and record the local-reference limitation here -- partial
  # coverage recorded honestly, never claimed as full.
  - package-ecosystem: pip
    directory: "/orchestration/dagster"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: []

  # GitHub Actions. The workflows pin actions by commit SHA (see the security
  # scan finding `actions-tag-pinned-not-sha`); Dependabot keeps those SHAs
  # current and surfaces a re-pointed / compromised action as a reviewable PR.
  #
  # RESOLVED (was spec 136 A3): A3 recorded the github-actions ecosystem as out
  # of that feature's pip scope and predicted the exact remedy -- "if a future
  # github-actions bot subject were to carry a scoped `chore(deps):`-shaped
  # prefix, add the same `commit-message.prefix: build` here". That hypothetical
  # arrived on 2026-07-29: Dependabot inferred conventional commits from this
  # repo's history and emitted `build(deps): bump actions/setup-python from
  # 6.3.0 to 7.0.0` (PR #531), whose parenthesized scope P2 rejects -- the bot
  # PR could not pass the gate without a human rewording its own commit. The
  # predicted remedy is applied: an explicit `prefix` with NO `include: scope`
  # yields the scope-free `build: bump X from A to B` the pip blocks already
  # produce.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: []
