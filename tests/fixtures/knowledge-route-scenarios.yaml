schema_version: 1
scenarios:
  - layer: bi-python-knowledge
    task_contains: Aggregate / groupby at a correct grain
    expect_resources:
      - knowledge/groupby-aggregation-and-grain.md
    terminal_contains: aggregation-grain-checklist

  - layer: bi-python-knowledge
    task_contains: Profile a freshly loaded dataframe
    expect_resources:
      - knowledge/profiling-and-source-inspection.md
    terminal_contains: dataframe-review-checklist

  - layer: bi-python-knowledge
    task_contains: Understand dataframe semantics for BI
    expect_resources:
      - knowledge/dataframe-mental-model.md
      - knowledge/python-core-concepts-for-bi.md
    terminal_contains: dataframe-review-checklist

  - layer: bi-python-knowledge
    task_contains: Judge dtypes or schema drift
    expect_resources:
      - knowledge/pandas-dtypes-and-schema.md
    terminal_contains: dataframe-review-checklist

  - layer: bi-python-knowledge
    task_contains: Merge two dataframes safely
    expect_resources:
      - knowledge/joins-merge-and-fanout.md
    terminal_contains: merge-fanout-checklist

  - layer: bi-python-knowledge
    task_contains: Classify nulls blanks and sentinels
    expect_resources:
      - knowledge/nulls-missing-values-and-blanks.md
    terminal_contains: dataframe-review-checklist

  - layer: bi-python-knowledge
    task_contains: Parse dates and periods
    expect_resources:
      - knowledge/dates-times-and-calendars.md
    terminal_contains: dataframe-review-checklist

  - layer: bi-python-knowledge
    task_contains: Validate and reconcile a dataframe result
    expect_resources:
      - knowledge/validation-and-reconciliation.md
      - patterns/validation-patterns.json
    terminal_contains: validation-reconciliation-checklist

  - layer: bi-python-knowledge
    task_contains: Diagnose dataframe performance or memory
    expect_resources:
      - knowledge/performance-and-memory.md
    terminal_contains: performance and memory verdict

  - layer: bi-python-knowledge
    task_contains: Review a Python pipeline against active rules
    expect_resources:
      - knowledge/python-anti-patterns.md
      - patterns/analyzer-rules.json
    terminal_contains: python-pipeline-review-checklist

  - layer: bi-python-knowledge
    task_contains: Apply recommended Python BI patterns
    expect_resources:
      - patterns/python-patterns.json
    terminal_contains: python-pipeline-review-checklist

  - layer: bi-python-knowledge
    task_contains: Study the worked dataframe example
    expect_resources:
      - knowledge/python-retail-examples.md
    terminal_contains: worked example evidence ledger

  - layer: bi-sql-knowledge
    task_contains: Write validation queries
    expect_resources:
      - patterns/sql-validation-patterns.json
      - knowledge/sql-reconciliation-playbook.md
    terminal_contains: sql-validation-checklist

  - layer: bi-dax-knowledge
    task_contains: Review existing DAX
    expect_resources:
      - patterns/analyzer-rules.json
      - knowledge/dax-best-practices.md
      - knowledge/dax-anti-patterns.md
      - checklists/dax-measure-review-checklist.md
    terminal_contains: dax-measure-review-checklist

  - layer: retail-kpi-knowledge
    task_contains: Write a brand-new KPI contract
    expect_resources:
      - references/metric-contract-template.md
    terminal_contains: metric-contract-review-checklist

  - layer: bi-bigdata-knowledge
    task_contains: Decide whether to scale out at all / pick an engine
    expect_resources:
      - knowledge/engine-selection.md
    terminal_contains: engine-selection-checklist

  - layer: bi-analyst-knowledge
    task_contains: Author the narrative brief
    expect_resources:
      - derivation-route.md
    terminal_contains: narrative-brief.md
