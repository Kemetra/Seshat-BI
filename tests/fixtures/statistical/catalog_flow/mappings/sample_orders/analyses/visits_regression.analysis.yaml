schema_version: "1.0"
analysis_id: visits_regression
revision: 1
question: What association do approved visits have with the weekly metric?
cadence: weekly
subject: sample_orders
owner: Example Analyst
readiness_status: mappings/sample_orders/readiness-status.yaml
metric_contracts:
  - mappings/sample_orders/metrics/TotalValue.yaml
provider:
  kind: local_csv
  dataset_id: synthetic_weekly_series
population:
  grain: one row per completed week
  inclusion: [completed weekly periods only]
  exclusion: []
roles:
  response:
    column: metric_value
    logical_type: number
  predictor:
    column: visits
    logical_type: number
method:
  id: regress
  version: "1.0"
  parameters:
    family: ols
    covariance: HC1
    confidence_level: "0.95"
missing_data:
  policy: complete_case
minimum_data:
  observations: 24
  groups: 1
  seasonal_cycles: 0
random_seed: 1729
pii:
  classification: none
  approval_evidence: []
  minimum_group_count: 5
outputs:
  evidence: mappings/sample_orders/analyses/visits_regression.evidence.json
  review: mappings/sample_orders/analyses/visits_regression.review.md
