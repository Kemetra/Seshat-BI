schema_version: "1.0"
analysis_id: weekly_change_points
revision: 1
question: Where does the approved weekly metric change level?
cadence: weekly
subject: sample_orders
owner: Example Analyst
readiness_status: mappings/sample_orders/readiness-status.yaml
metric_contracts:
  - mappings/sample_orders/metrics/TotalValue.yaml
provider:
  kind: local_csv
  dataset_id: synthetic_weekly_series
population:
  grain: one row per completed week
  inclusion: [completed weekly periods only]
  exclusion: []
roles:
  response:
    column: metric_value
    logical_type: number
  time:
    column: week_start
    logical_type: date
method:
  id: detect_change_points
  version: "1.0"
  parameters:
    model: l2
    min_segment: 6
    algorithm: pelt
    penalty: "12.0"
missing_data:
  policy: complete_case
minimum_data:
  observations: 24
  groups: 1
  seasonal_cycles: 0
random_seed: 1729
pii:
  classification: none
  approval_evidence: []
  minimum_group_count: 5
outputs:
  evidence: mappings/sample_orders/analyses/weekly_change_points.evidence.json
  review: mappings/sample_orders/analyses/weekly_change_points.review.md
