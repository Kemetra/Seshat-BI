schema_version: "1.0"
analysis_id: weekly_signal
revision: 1
question: What is the distribution of the approved weekly metric?
cadence: weekly
subject: sample_orders
owner: Example Analyst
readiness_status: mappings/sample_orders/readiness-status.yaml
metric_contracts:
  - mappings/sample_orders/metrics/TotalValue.yaml
provider:
  kind: local_csv
  dataset_id: synthetic_weekly_metric
population:
  grain: one row per completed week
  inclusion: [completed weekly periods only]
  exclusion: []
roles:
  response:
    column: metric_value
    logical_type: number
method:
  id: describe
  version: "1.0"
  parameters:
    quantiles: ["0.25", "0.5", "0.75"]
    outlier_rule: none
missing_data:
  policy: complete_case
minimum_data:
  observations: 12
  groups: 1
  seasonal_cycles: 0
random_seed: 1729
pii:
  classification: none
  approval_evidence: []
  minimum_group_count: 5
outputs:
  evidence: mappings/sample_orders/analyses/weekly_signal.evidence.json
  review: mappings/sample_orders/analyses/weekly_signal.review.md
